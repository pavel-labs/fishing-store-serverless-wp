name: Build and verify PHP runtime

on:
  push:
    branches: [security/php-patched-runtime]
    paths:
      - 'build/php/**'
      - '.github/workflows/php-runtime.yml'
      - 'util/install-php-runtime.js'
  pull_request:
    paths:
      - 'build/php/**'
      - 'vendor/php/**'
      - 'util/**'
      - 'api/**'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/php-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build patched PHP from verified source
        if: github.event_name != 'pull_request'
        run: docker build --platform linux/amd64 --output type=local,dest=.php-runtime -f build/php/Dockerfile .
      - name: Package runtime with checksums
        if: github.event_name != 'pull_request'
        run: node build/php/package.js
      - name: Install framework without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install SQLite native test dependency
        run: npm rebuild sqlite3
      - name: Install reviewed PHP runtime
        run: node util/install-php-runtime.js
      - name: Test in the deployment operating system
        run: >-
          docker run --rm --network host --entrypoint bash
          -v "$PWD:/var/task" -w /var/task
          -e SERVERLESSWP_TESTING=1
          -e DATABASE=wordpress_test -e USERNAME=root -e PASSWORD=test-only-password
          -e HOST=127.0.0.1:3306 -e SKIP_MYSQL_SSL=1
          public.ecr.aws/lambda/nodejs:22
          -c 'npm run security:php && npm test && node test/php-wordpress-smoke.js'
      - uses: actions/upload-artifact@v4
        with:
          name: php-8.3.36-al2023-x64
          path: |
            vendor/php/php-runtime.tar.gz
            vendor/php/runtime.json
      - name: Commit verified runtime to the update branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/php-patched-runtime'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/php/php-runtime.tar.gz vendor/php/runtime.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: bundle verified PHP 8.3.36 runtime'
            git push origin HEAD:security/php-patched-runtime
          fi
    permissions:
      contents: write
